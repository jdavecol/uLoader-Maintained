name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            if dkp-pacman -S --noconfirm --needed ppc-zlib 2>/dev/null; then break; fi
            echo "retry install $i ..."; sleep 15
          done
          dkp-pacman -Q | grep zlib

      - name: Inspect crt
        run: |
          nm="$DEVKITPPC/bin/powerpc-eabi-nm"
          echo "== crt0.o:"; "$nm" /opt/devkitpro/devkitPPC/powerpc-eabi/lib/crt0.o | grep -E '_start|T _' | head
          echo "== crtmain.o:"; "$nm" /opt/devkitpro/devkitPPC/powerpc-eabi/lib/crtmain.o | grep -E '_start|T _' | head

      - name: Build uLoader (devkitPPC)
        run: |
          cd src/uloader
          make

      - name: Inspect linked output
        run: |
          gcc="$DEVKITPPC/bin/powerpc-eabi-gcc"; nm="$DEVKITPPC/bin/powerpc-eabi-nm"
          echo "== dol sizes:"; ls -la src/uloader/uloader.dol src/uloader/uloader_alt.dol
          echo "== elf sizes:"; ls -la src/uloader/uloader/uloader.elf src/uloader/uloader_alt/uloader_alt.elf
          echo "== elf _start/main symbols:"; "$nm" src/uloader/uloader/uloader.elf | grep -iE '[_](start|main)$|call_main|__crt' | head
          echo "== reference link (rvl, no -T):"; printf 'int main(void){return 0;}\n' >/tmp/m.c; "$gcc" -mrvl -v -o /tmp/m.elf /tmp/m.c 2>&1 | grep -E 'crt0|crti|crtbegin|rvl.ld|T ' | head
          echo "== reference size (no -T):"; ls -la /tmp/m.elf 2>/dev/null; "$nm" /tmp/m.elf | grep -E '[_](start|main)' | head

      - name: Upload boot.dol artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uloader-boot-dol
          path: |
            src/uloader/uloader.dol
            src/uloader/uloader_alt.dol
          if-no-files-found: error