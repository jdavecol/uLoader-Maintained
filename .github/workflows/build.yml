name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: dkp-pacman -Syy --noconfirm ppc-zlib

      - name: Inspect wii_rules
        run: cat "$DEVKITPPC/wii_rules"; echo "== rvl libs:"; ls "$DEVKITPPC/lib" | head -30; echo "== spec files:"; ls "$DEVKITPPC/lib/gc/" 2>/dev/null; ls "$DEVKITPRO" | head

      - name: Build uLoader (devkitPPC)
        run: |
          cd src/uloader
          make

      - name: Upload boot.dol artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uloader-boot-dol
          path: |
            src/uloader/uloader.dol
            src/uloader/uloader_alt.dol
          if-no-files-found: error