name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            if dkp-pacman -S --noconfirm --needed ppc-zlib 2>/dev/null; then break; fi
            echo "retry install $i ..."; sleep 15
          done
          dkp-pacman -Q | grep zlib

      - name: Inspect crt
        run: |
          nm="$DEVKITPPC/bin/powerpc-eabi-nm"
          echo "== newlib dir wrappers in libc:"; "$nm" --defined-only /opt/devkitpro/devkitPPC/powerpc-eabi/lib/libc.a 2>/dev/null | grep -iE 'diropen|dirnext|dirclose' | head
          echo "== wii sys/dir.h:"; find /opt/devkitpro/devkitPPC -name 'dir.h' -path '*sys*' 2>/dev/null; find /opt/devkitpro/libogc -name 'dir.h' 2>/dev/null
          echo "== where app resolves sys/dir.h + DIR_ITER:"; printf '#include <sys/dir.h>\n#include <sys/iosupport.h>\nDIR_ITER *d;\ndevoptab_t *v;\n' > /tmp/diag.c; "$DEVKITPPC/bin/powerpc-eabi-gcc" -I/opt/devkitpro/libogc/include -H -E -x c /tmp/diag.c 2>&1 | grep -iE 'dir\.h|iosupport'
          echo "== devoptab_t def:"; sed -n '1,160p' /opt/devkitpro/devkitPPC/powerpc-eabi/include/sys/iosupport.h || true

      - name: Build libfat (Hermes)
        run: make -C src/uloader/libfat install 2>&1 | tail -30

      - name: Build uLoader (devkitPPC)
        run: |
          cd src/uloader
          make

      - name: Inspect linked output
        run: |
          echo "== dol sizes:"; ls -la src/uloader/uloader.dol src/uloader/uloader_alt.dol
          echo "== elf sizes:"; ls -la src/uloader/uloader/uloader.elf src/uloader/uloader_alt/uloader_alt.elf

      - name: Upload boot.dol artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uloader-boot-dol
          path: |
            src/uloader/uloader.dol
            src/uloader/uloader_alt.dol
          if-no-files-found: error