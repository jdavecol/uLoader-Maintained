name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: dkp-pacman -Syy --noconfirm ppc-zlib

      - name: Inspect crt
        run: |
          nm="$DEVKITPPC/bin/powerpc-eabi-nm"
          echo "== crt0.o:"; "$nm" /opt/devkitpro/devkitPPC/powerpc-eabi/lib/crt0.o | grep -E '_start|T _' | head
          echo "== crtmain.o:"; "$nm" /opt/devkitpro/devkitPPC/powerpc-eabi/lib/crtmain.o | grep -E '_start|T _' | head

      - name: Build uLoader (devkitPPC)
        run: |
          cd src/uloader
          make

      - name: Upload boot.dol artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uloader-boot-dol
          path: |
            src/uloader/uloader.dol
            src/uloader/uloader_alt.dol
          if-no-files-found: error