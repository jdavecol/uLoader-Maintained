name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: dkp-pacman -Syy --noconfirm ppc-zlib

      - name: Inspect wii_rules
        run: cat "$DEVKITPPC/base_rules"; gcc="$DEVKITPPC/bin/powerpc-eabi-gcc"; echo "== crt0 in spec:"; "$gcc" -mrvl -print-file-name=crt0.o; echo "== gcc base:"; "$gcc" -print-file-name=libgcc.a; echo "== crt files:"; find /opt/devkitpro/devkitPPC -name 'crt*.o' 2>/dev/null | head -20; echo "== ldscripts in devkitppc:"; find /opt/devkitpro/devkitPPC /opt/devkitpro -name 'rvl.ld' -o -name '*.ld' 2>/dev/null | head -10; echo "== libogc wii libs:"; ls "$DEVKITPRO/libogc/lib/wii" 2>/dev/null | head -30

      - name: Build uLoader (devkitPPC)
        run: |
          cd src/uloader
          make

      - name: Upload boot.dol artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uloader-boot-dol
          path: |
            src/uloader/uloader.dol
            src/uloader/uloader_alt.dol
          if-no-files-found: error